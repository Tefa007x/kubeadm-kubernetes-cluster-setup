---
####################################################################
##  STEP 1: Common Prerequisites on All Nodes (Master + Workers)  ##
####################################################################
- name: Prepare all Kubernetes nodes (OS, /etc/hosts, containerd, kubeadm)
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Set node hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Add cluster nodes private IPs and hostnames to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} ANSIBLE MANAGED K8S HOSTS"
        block: |
          {% for host in groups['k8s_cluster'] %}
          {{ hostvars[host]['private_ip'] }} {{ host }}
          {% endfor %}

    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap permanently in /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    - name: Configure kernel modules for Kubernetes
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Load overlay and br_netfilter modules
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Configure sysctl parameters for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        state: present
        reload: true
      loop:
        - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { key: 'net.ipv4.ip_forward', value: '1' }

    - name: Install required apt packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - apt-transport-https
          - conntrack
          - socat 
        state: present
        update_cache: true

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key for containerd
      ansible.builtin.shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker repository
      ansible.builtin.shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install containerd.io
      ansible.builtin.apt:
        name: containerd.io
        state: present
        update_cache: true

    - name: Generate default containerd config.toml with SystemdCgroup enabled
      ansible.builtin.shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/g' /etc/containerd/config.toml
      notify: Restart containerd

    - name: Flush handlers to ensure containerd is running with SystemdCgroup
      ansible.builtin.meta: flush_handlers

    - name: Add Kubernetes v1.31 APT GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.31/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes v1.31 APT repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.31/deb/ /\n"
        mode: '0644'

    - name: Install kubelet, kubeadm, and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold kubelet, kubeadm, and kubectl packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true

##################################################################
##  STEP 2: Initialize Control Plane & Deploy Cilium on Master  ##
##################################################################
- name: Initialize Kubernetes Control Plane with Cilium CNI
  hosts: master
  become: true
  tasks:
    - name: Check if Kubernetes Master is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_admin_conf

    - name: Initialize kubeadm Control Plane (skipping kube-proxy for Cilium eBPF)
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ private_ip }}
        --pod-network-cidr=10.244.0.0/16
        --skip-phases=addon/kube-proxy
      when: not k8s_admin_conf.stat.exists

    - name: Create .kube directory for ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy admin.conf to ubuntu user's kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Install Cilium CLI on Master
      ansible.builtin.shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm -f cilium-linux-${CLI_ARCH}.tar.gz cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
      args:
        executable: /bin/bash
        creates: /usr/local/bin/cilium

    - name: Check if Cilium DaemonSet is already deployed
      become: false
      ansible.builtin.command: kubectl get ds -n kube-system cilium
      register: cilium_ds
      failed_when: false
      changed_when: false

    - name: Install Cilium CNI on Master
      become: false
      ansible.builtin.command: >
        /usr/local/bin/cilium install
        --set ipam.operator.clusterPoolIPv4PodCIDRList="10.244.0.0/16"
        --set kubeProxyReplacement=true
        --set k8sServiceHost={{ private_ip }}
        --set k8sServicePort=6443
      environment:
        KUBECONFIG: /home/ubuntu/.kube/config
      register: cilium_install
      changed_when: "'Cilium was successfully installed' in cilium_install.stdout"
      failed_when:
        - cilium_install.rc != 0
        - "'already installed' not in cilium_install.stderr"

    - name: Generate kubeadm join command for workers
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Store join command in dummy host for Worker play
      ansible.builtin.add_host:
        name: "K8S_TOKEN_HOLDER"
        join_command: "{{ join_command_raw.stdout }}"

################################################
##  STEP 3: Join Worker Nodes to the Cluster  ##
################################################
- name: Join Worker Nodes to Kubernetes Cluster
  hosts: workers
  become: true
  tasks:
    - name: Check if Worker node has already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Join the Kubernetes cluster
      ansible.builtin.command: "{{ hostvars['K8S_TOKEN_HOLDER']['join_command'] }}"
      when: not kubelet_conf.stat.exists